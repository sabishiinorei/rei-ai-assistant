<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rei</title>

  <!-- cache-bust чтобы браузер точно подхватил новые стили -->
  <link rel="stylesheet" href="style.css?v=1" />
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
</head>
<body>

<div class="app">

  <div class="header">
    <div id="avatar" class="avatar calm"></div>

    <div class="titles">
      <div class="status">online</div>
      <h1>Rei</h1>
      <div class="subtitle">EVA AI Interface</div>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="message rei">
      <div class="text">Привет Сенпай, чем помочь?</div>
      <div class="time">—</div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" rows="1" placeholder="Написать Рей…"></textarea>
    <button id="send">➤</button>
  </div>

  <div class="footer">EVA-inspired UI · Rei v0.1</div>
</div>

<!-- reiState -->
<script type="module" src="./reiState.js"></script>

<!-- UI -->
<script type="module" src="script.js?v=1"></script>

<!-- Контейнер 3D модели -->
<div id="rei-3d-container"></div>

<!-- 3D Модель -->
<script type="module" src="./rei3d.js"></script>

<!-- EVA HUD -->
<div id="eva-hud">
  <div class="eva-frame">

    <div class="eva-corner tl"></div>
    <div class="eva-corner tr"></div>
    <div class="eva-corner bl"></div>
    <div class="eva-corner br"></div>

    <div class="eva-inner">

      <div class="eva-title">REI - EVA INTERFACE</div>

      <div class="eva-row">
        <span class="label">SYNC STATUS</span>
        <span class="value online">ONLINE</span>
      </div>

      <div class="eva-row">
        <span class="label">EMO-STATE</span>
        <span class="value mood" id="hud-mood">CALM</span>
      </div>

      <div class="eva-row">
        <span class="label">ENERGY FLOW</span>
        <div class="energy-bar">
          <div class="energy-fill" id="hud-energy"></div>
        </div>
      </div>

      <div class="eva-footer">CORE LINK :: STABLE</div>

      <div class="eva-tech">
        NODE: EVA-01<br>
        CORE: REI.AI<br>
        PROTOCOL: NOMINAL
      </div>

    </div>
  </div>
</div>

</body>
</html>
